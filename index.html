<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131c"><title>CNC Factory</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#ebf5f9;background:#071018;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:#071018}header{display:flex;align-items:center;gap:12px;padding:7px 12px;min-height:53px;background:#091721;border-bottom:1px solid #365565;z-index:2}h1{font-size:20px;letter-spacing:.05em;white-space:nowrap;margin:0 12px 0 0}.stats{display:flex;gap:7px;flex:1}.stat{background:#142a36;border:1px solid #3e5a69;border-radius:8px;padding:4px 9px;min-width:105px;white-space:nowrap}.stat small{display:block;text-transform:uppercase;color:#a3bac5;font-size:10px}.stat strong{font-size:15px;font-variant-numeric:tabular-nums}.status{white-space:nowrap;font-size:13px;font-weight:800;color:#6be0a5}.status.paused{color:#f1c576}
main{position:relative;flex:1;min-height:0;overflow:hidden}#stage{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 45%,#25404e,#091923 75%)}.view{flex:1;min-height:0;position:relative;overflow:hidden}.hall-view{display:grid;place-items:center}.hall-map{position:relative;aspect-ratio:1;width:min(100%,calc(100dvh - 160px),900px);max-height:100%;background:#172b35;box-shadow:0 0 50px #0009;transition:transform .34s ease,opacity .34s ease}.hall-map.zooming{transform:scale(1.75) translate(12%,12%);opacity:0}.hall-map img{display:block;width:100%;height:100%;object-fit:cover}
.bay{position:absolute;display:flex;justify-content:flex-end;align-items:center;flex-direction:column;padding:4px 3px;border:2px solid transparent;border-radius:10px;color:#fff;background:transparent;text-align:center}.bay span{background:#091925e8;border:1px solid #648697;border-radius:7px;padding:5px 7px;font-size:clamp(11px,2.6vw,15px);font-weight:800;line-height:1.1;text-shadow:0 1px 2px #000}.bay:focus-visible,.bay:hover{outline:none;border-color:#98dff1;background:#68d9ff25}.bay.installed span{border-color:#6ed8ef;background:#0a3449ed}.bay-1{left:9%;top:18%;width:41%;height:29%}.bay-2{left:53%;top:18%;width:39%;height:29%}.bay-3{left:7%;top:51%;width:43%;height:36%}.bay-4{left:53%;top:51%;width:40%;height:36%}
.detail-view{background:#142a36}#detail-view[hidden]{display:block!important;position:absolute;inset:0 0 67px;visibility:hidden;pointer-events:none}#game{position:absolute;inset:0}#game canvas{display:block}.back{position:absolute;top:12px;left:12px;z-index:1;min-height:42px;padding:8px 13px;color:#fff;background:#0a2231ea;border:1px solid #7ba9bc;border-radius:9px;font-weight:800}
.readout{display:flex;align-items:center;min-height:67px;padding:8px 14px;background:#0a202ce9;border-top:1px solid #456675}.readout-text{flex:1;min-width:0}.machine-name{color:#91d9f2;font-size:11px;font-weight:800;letter-spacing:.05em}.readout strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:8px;margin:4px 0;background:#29434e;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#278db9,#6de8c9)}.sub{display:flex;gap:8px;justify-content:space-between;color:#c6d9df;font-size:11px;white-space:nowrap}
footer{display:flex;align-items:center;gap:7px;padding:6px 9px max(6px,env(safe-area-inset-bottom));background:#091721;border-top:1px solid #365565;z-index:3}.nav-button,.pause{min-height:43px;border-radius:8px;background:#1d3b4b;border:1px solid #54788a;color:#fff;font-size:13px;font-weight:800;padding:6px 10px}.nav-button{flex:1}.nav-button.active{background:#287fa9;border-color:#8ad9ee}.pause{background:#795039;border-color:#aa7955}.pause.active{background:#2e7459;border-color:#6abe8e}
#speed-menu{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom));right:8px;z-index:6;display:flex;gap:5px;padding:8px;background:#112b38;border:1px solid #54788a;border-radius:10px;box-shadow:0 8px 24px #000b}.speed{min-width:47px;min-height:42px;border-radius:7px;background:#1d3b4b;border:1px solid #54788a;color:#fff;font-weight:800}.speed.active{background:#287fa9;border-color:#8ad9ee}
.scrim{position:absolute;inset:0;background:#0009;z-index:3}.drawer{position:absolute;z-index:4;right:0;bottom:0;width:min(100%,410px);max-height:92%;display:flex;flex-direction:column;background:#0b1923;border:1px solid #527486;border-radius:15px 15px 0 0;box-shadow:0 -8px 35px #0009}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #365565}.drawer-head h2{font-size:18px;margin:0}.close{min-width:42px;min-height:42px;border:1px solid #527486;background:#193541;border-radius:8px;color:#fff;font-size:22px}.drawer-body{overflow:auto;overscroll-behavior:contain;padding:10px 14px max(12px,env(safe-area-inset-bottom))}.drawer-body h3{font-size:16px;margin:2px 0 4px}.hint,.machine-meta{font-size:12px;color:#adbfca;margin:0 0 11px}.card{border:1px solid #3b6071;background:linear-gradient(145deg,#15313d,#10222c);padding:11px;border-radius:11px;margin:8px 0;cursor:pointer}.card.selected{border:2px solid #5bc9e8;background:#173c4d}.card.running{border-color:#69da9d}.card .top,.card .values{display:flex;justify-content:space-between;gap:8px;font-size:11px}.card .top{color:#82d8f2;font-weight:800}.card h3{font-size:16px;margin:5px 0}.card p{color:#bbced6;font-size:12px;margin:4px 0}.card .values{color:#f4cc77;margin-top:9px}.card .values b{color:#7ce6ad}.card button,.action{min-height:39px;border-radius:8px;border:1px solid #60aaa6;background:#276a58;color:#fff;padding:7px 10px;font-weight:800;font-size:12px}.card button{width:100%;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#244c5b;border-color:#4d7a89}.action b{display:block;color:#bed0d8;font-size:10px;margin-top:2px}.meter-label{display:flex;justify-content:space-between;margin-top:15px;font-size:12px}.meter{height:8px;margin-top:5px;background:#29434e;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:#69da9f}.meter.orange span{background:#efbd68}.machine-meta{line-height:1.6;margin:10px 0}
.message{position:absolute;z-index:7;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:9px 12px;background:#183440;border:1px solid #79b3bd;border-radius:9px;color:#f3d18d;text-align:center;font-size:12px;pointer-events:none}.message:empty{display:none}
@media(orientation:portrait){header{gap:5px;padding:5px 7px;min-height:53px}h1{font-size:13px;margin-right:2px}.stats{gap:4px}.stat{min-width:0;flex:1;padding:3px 4px;text-align:center}.stat small{font-size:8px}.stat strong{font-size:11px}.status{display:none}.readout{min-height:66px;padding:7px 10px}#detail-view[hidden]{bottom:66px}.nav-button,.pause{font-size:12px;padding:5px 6px}.pause{min-width:75px}.hall-map{width:min(100%,calc(100dvh - 188px))}}@media(orientation:landscape) and (max-height:560px){header{min-height:37px;padding:2px 7px}h1{font-size:15px}.stat{padding:1px 5px}.stat small{font-size:8px}.stat strong{font-size:11px}.status{font-size:10px}.hall-map{width:min(100%,calc(100dvh - 130px))}.readout{min-height:46px;padding:3px 10px}#detail-view[hidden]{bottom:46px}.readout strong{font-size:13px}.nav-button,.pause{min-height:34px}footer{padding:3px 7px}.drawer{max-height:98%}#speed-menu{bottom:43px}}@media(prefers-reduced-motion:reduce){.hall-map{transition:none}}
</style></head><body><div id="app">
<header><h1>CNC FACTORY</h1><div class="stats"><div class="stat"><small>Konto</small><strong id="money">€ 0</strong></div><div class="stat"><small>Material</small><strong id="material">0 kg</strong></div><div class="stat"><small>Teile</small><strong id="parts">0 fertig</strong></div></div><span id="status" class="status">● Bereit</span></header>
<main><section id="stage" aria-label="CNC Factory Halle"><div class="view hall-view" id="hall-view"><div class="hall-map" id="hall-map"><img src="hall-four-bays.jpg?v=2" alt="Produktionshalle mit einer CNC-Maschine und drei freien Stellplätzen"><button class="bay bay-1 installed" id="machine-bay" type="button" aria-label="Nexora NX-350 ansehen"><span>Nexora NX-350</span></button><button class="bay bay-2" data-empty-bay="2" type="button" aria-label="Freier Stellplatz 2"><span>Freier Platz 2</span></button><button class="bay bay-3" data-empty-bay="3" type="button" aria-label="Freier Stellplatz 3"><span>Freier Platz 3</span></button><button class="bay bay-4" data-empty-bay="4" type="button" aria-label="Freier Stellplatz 4"><span>Freier Platz 4</span></button></div></div><div class="view detail-view" id="detail-view" hidden><div id="game"></div><button class="back" id="back-to-hall" type="button">← Halle</button></div><div class="readout"><div class="readout-text"><span class="machine-name">NEXORA NX-350 · DREHZENTRUM</span><strong id="part-name">Auftrag auswählen</strong><div class="track"><div class="fill" id="progress"></div></div><div class="sub"><span id="progress-label">Bereit für den nächsten Auftrag</span><span id="clock">Mo 00:00</span></div></div></div></section>
<div class="scrim" id="scrim" hidden></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><div class="drawer-head"><h2 id="drawer-title">Aufträge</h2><button class="close" id="close-drawer" type="button" aria-label="Menü schließen">×</button></div><div class="drawer-body"><section id="orders-panel"><h3>Auftragsbörse</h3><p class="hint">Auftrag wählen und starten. Material wird beim Start reserviert.</p><div id="orders"></div></section><section id="machine-panel" hidden><h3>Nexora NX-350</h3><p class="machine-meta" id="machine-meta"></p><div class="actions"><button class="action" id="buy-material" type="button">Material kaufen<b>+100 kg · € 2.200</b></button><button class="action" id="change-tool" type="button">Werkzeugwechsel<b>€ 650 · Stillstand</b></button><button class="action" id="maintenance" type="button">Wartung<b>€ 1.200 · Stillstand</b></button><button class="action" id="upgrade" type="button">Upgrade<b id="upgrade-cost"></b></button></div><div class="meter-label"><span>Werkzeug</span><span id="tool-label"></span></div><div class="meter"><span id="tool-meter"></span></div><div class="meter-label"><span>Wartungszustand</span><span id="maintenance-label"></span></div><div class="meter orange"><span id="maintenance-meter"></span></div></section></div></aside>
<div class="message" id="message" role="status" aria-live="polite"></div><div id="speed-menu" hidden><button type="button" class="speed active" data-speed="1">1×</button><button type="button" class="speed" data-speed="2">2×</button><button type="button" class="speed" data-speed="5">5×</button><button type="button" class="speed" data-speed="10">10×</button></div></main>
<footer><button type="button" class="nav-button" id="orders-tab" aria-expanded="false">Aufträge</button><button type="button" class="nav-button" id="machine-tab" aria-expanded="false">Maschine</button><button type="button" class="pause" id="pause">⏸ Pause</button><button type="button" class="nav-button" id="speed-toggle" aria-expanded="false" style="flex:0 0 auto">Tempo <span id="speed-value">1×</span></button></footer></div><script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script><script src="game.js?v=2"></script></body></html>
