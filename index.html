<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131c"><title>CNC Factory</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#ebf5f9;background:#071018;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}[hidden]{display:none!important}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#071018}header{display:flex;align-items:center;gap:12px;padding:7px 12px;min-height:54px;background:#091721;border-bottom:1px solid #365565}h1{font-size:21px;letter-spacing:.05em;white-space:nowrap;margin:0 12px 0 0}.stats{display:flex;gap:7px;flex:1}.stat{background:#142a36;border:1px solid #3e5a69;border-radius:8px;padding:4px 9px;min-width:105px;white-space:nowrap}.stat small{display:block;text-transform:uppercase;color:#a3bac5;font-size:10px}.stat strong{font-size:15px;font-variant-numeric:tabular-nums}.status{white-space:nowrap;font-size:13px;font-weight:800;color:#6be0a5}.status.paused{color:#f1c576}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,360px);min-height:0}#stage{position:relative;overflow:hidden;min-width:0;background:#182d37}#game{position:absolute;inset:0}#game canvas{display:block}.stage-readout{position:absolute;left:14px;bottom:14px;width:min(390px,calc(100% - 28px));padding:11px 14px;background:#081925eb;border:1px solid #4b7586;border-radius:11px;box-shadow:0 10px 30px #0009}.machine-name{color:#91d9f2;font-size:12px;font-weight:800;letter-spacing:.05em}.stage-readout strong{display:block;font-size:20px;margin:2px 0}.sub{display:flex;justify-content:space-between;font-size:12px;color:#c6d9df}.track,.meter{background:#29434e;border-radius:10px;overflow:hidden}.track{height:10px;margin:8px 0 5px}.fill{height:100%;width:0;background:linear-gradient(90deg,#278db9,#6de8c9);transition:width .12s linear}
aside{min-height:0;overflow:auto;overscroll-behavior:contain;background:#0b1923;border-left:1px solid #365565;padding:13px}.tabs{position:sticky;top:-13px;z-index:2;display:flex;gap:7px;background:#0b1923;padding-bottom:9px}.tabs button{flex:1;min-height:38px;color:#e4f0f4;background:#1a3644;border:1px solid #456a7a;border-radius:8px;font-size:13px;font-weight:800}.tabs button.active{background:#24759c;border-color:#76cde9}h2{font-size:18px;margin:2px 0 3px}.hint,.machine-meta{font-size:12px;color:#adbfca;margin:0 0 11px}.card{border:1px solid #3b6071;background:linear-gradient(145deg,#15313d,#10222c);padding:11px;border-radius:11px;margin:8px 0;cursor:pointer}.card.selected{border:2px solid #5bc9e8;background:#173c4d}.card.running{border-color:#69da9d}.card .top,.card .values{display:flex;justify-content:space-between;gap:8px;font-size:11px}.card .top{color:#82d8f2;font-weight:800}.card h3{font-size:16px;margin:5px 0}.card p{color:#bbced6;font-size:12px;margin:4px 0}.card .values{color:#f4cc77;margin-top:9px}.card .values b{color:#7ce6ad}.card button,.action{min-height:39px;border-radius:8px;border:1px solid #60aaa6;background:#276a58;color:#fff;padding:7px 10px;font-weight:800;font-size:12px}.card button{width:100%;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#244c5b;border-color:#4d7a89}.action b{display:block;color:#bed0d8;font-size:10px;margin-top:2px}.meter-label{display:flex;justify-content:space-between;margin-top:15px;font-size:12px}.meter{height:8px;margin-top:5px}.meter span{display:block;height:100%;background:#69da9f}.meter.orange span{background:#efbd68}.machine-meta{line-height:1.6;margin:10px 0}.message{color:#f3c97d;font-size:12px;min-height:18px;margin-top:11px}
footer{display:flex;justify-content:center;align-items:center;gap:7px;padding:6px 9px max(6px,env(safe-area-inset-bottom));background:#091721;border-top:1px solid #365565}.speed-label{font-size:11px;color:#b3cad4;text-transform:uppercase}.speed,.pause{min-width:54px;min-height:40px;border-radius:8px;background:#1d3b4b;border:1px solid #54788a;color:#fff;font-size:13px;font-weight:800}.speed.active{background:#287fa9;border-color:#8ad9ee}.pause{min-width:120px;background:#795039;border-color:#aa7955}.pause.active{background:#2e7459;border-color:#6abe8e}
@media(max-width:850px) and (orientation:landscape){header{min-height:38px;padding:3px 7px;gap:5px}h1{font-size:14px;margin:0 4px 0 0}.stats{gap:4px}.stat{min-width:0;border-radius:5px;padding:2px 5px}.stat small{font-size:8px}.stat strong{font-size:11px}.status{font-size:10px}main{grid-template-columns:minmax(0,1fr) minmax(285px,40%)}aside{padding:6px 9px}.tabs{top:-6px;padding-bottom:4px}.tabs button{min-height:32px;font-size:11px}h2{font-size:15px}.hint{font-size:10px;margin-bottom:5px}.card{margin:5px 0;padding:7px;border-radius:8px}.card .top,.card .values,.card p{font-size:10px;margin:2px 0}.card h3{font-size:13px;margin:3px 0}.card button{min-height:33px;margin-top:5px;font-size:11px}.stage-readout{left:7px;bottom:7px;padding:6px 9px;width:min(320px,calc(100% - 14px))}.machine-name,.sub{font-size:10px}.stage-readout strong{font-size:14px}.track{height:7px;margin:4px 0 3px}footer{padding:3px 6px;gap:5px}.speed,.pause{min-width:43px;min-height:33px;font-size:11px}.pause{min-width:96px}.speed-label{font-size:9px}}
@media(orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:minmax(180px,42%) minmax(0,1fr)}aside{border-left:0;border-top:1px solid #365565}.status{display:none}.stat{min-width:0;padding:3px 5px}.stat small{font-size:8px}.stat strong{font-size:11px}h1{font-size:15px;margin:0}.speed-label{display:none}.speed{min-width:42px}.pause{min-width:95px}}
</style></head><body><div id="app"><header><h1>CNC FACTORY</h1><div class="stats"><div class="stat"><small>Konto</small><strong id="money">€ 0</strong></div><div class="stat"><small>Material</small><strong id="material">0 kg</strong></div><div class="stat"><small>Teile</small><strong id="parts">0 / 0</strong></div></div><span id="status" class="status">● Bereit</span></header><main><section id="stage" aria-label="Nexora Maschinenzelle"><div id="game"></div><div class="stage-readout"><span class="machine-name">NEXORA NX-350 · DREHZENTRUM</span><strong id="part-name">Auftrag auswählen</strong><div class="track"><div class="fill" id="progress"></div></div><div class="sub"><span id="progress-label">0 % · 0 / 0 Teile</span><span id="clock">Mo 00:00</span></div></div></section><aside><div class="tabs"><button id="orders-tab" class="active" type="button">Aufträge</button><button id="machine-tab" type="button">Maschine</button></div><section id="orders-panel"><h2>Auftragsbörse</h2><p class="hint">Auftrag wählen und starten. Material wird beim Start reserviert.</p><div id="orders"></div></section><section id="machine-panel" hidden><h2>Nexora NX-350</h2><p class="machine-meta" id="machine-meta"></p><div class="actions"><button class="action" id="buy-material" type="button">Material kaufen<b>+100 kg · € 2.200</b></button><button class="action" id="change-tool" type="button">Werkzeugwechsel<b>€ 650 · Stillstand</b></button><button class="action" id="maintenance" type="button">Wartung<b>€ 1.200 · Stillstand</b></button><button class="action" id="upgrade" type="button">Upgrade<b id="upgrade-cost"></b></button></div><div class="meter-label"><span>Werkzeug</span><span id="tool-label"></span></div><div class="meter"><span id="tool-meter"></span></div><div class="meter-label"><span>Wartungszustand</span><span id="maintenance-label"></span></div><div class="meter orange"><span id="maintenance-meter"></span></div></section><div class="message" id="message" role="status" aria-live="polite"></div></aside></main><footer><button type="button" class="pause" id="pause">⏸ Pause</button><span class="speed-label">Tempo</span><button type="button" class="speed active" data-speed="1">1×</button><button type="button" class="speed" data-speed="2">2×</button><button type="button" class="speed" data-speed="5">5×</button><button type="button" class="speed" data-speed="10">10×</button></footer></div><script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script><script src="game.js"></script></body></html>
